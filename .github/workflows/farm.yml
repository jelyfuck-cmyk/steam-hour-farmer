name: Steam Hour Farmer

on:
  workflow_dispatch:
    inputs:
      steam_guard:
        description: 'Сюда пиши код Steam Guard'
        required: false
        default: ''

jobs:
  run-farmer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Farmer
        run: |
          if [ ! -z "${{ github.event.inputs.steam_guard }}" ]; then
            node index.js --code="${{ github.event.inputs.steam_guard }}"
          else
            node index.js
          fi
        env:
          ACCOUNT_NAME: ${{ secrets.ACCOUNT_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          GAMES: ${{ secrets.GAMES }}
